<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to Our Little World</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="intro"><div id="gate"><div class="door l"></div><div class="door r"></div></div><h1>Welcome to Our Little World</h1><button id="enter">ENTER THE WORLD</button></div>
<div id="hud">Welcome to Our Little World<small>Bấm vào nhân vật để xem portfolio</small></div>
<div id="ctl"><button id="snd">🔊</button><input id="vol" type="range" min="0" max="1" step="0.05" value="0.35" title="Âm lượng"><button id="nt">🌙</button></div>
<div id="help">🖱 Kéo chuột: xoay · Lăn chuột: zoom<br>⌨ WASD / mũi tên: di chuyển<br>👆 Bấm nhân vật → 🎮 ĐIỀU KHIỂN<br>để chạy (WASD) và nhảy (Space)</div>
<div id="card"><img id="cimg"><div><b id="cname"></b><div id="ctrait" style="font-size:13px;color:#555"></div></div><button id="cplay">🎮 ĐIỀU KHIỂN</button><button id="cbtn">XEM PORTFOLIO</button><button id="cback">← Toàn cảnh</button></div>
<div id="playbar">🎮 Đang điều khiển <b id="pbname"></b> · WASD / mũi tên: chạy · Space: nhảy <button id="pbtn" style="background:#f97316;color:#fff">XEM PORTFOLIO</button><button id="pexit" style="background:#e2e8f0">Thoát (Esc)</button></div>
<div id="panel"><div id="box"><div id="bar"><strong id="pname"></strong><span><a id="plink" target="_blank">Mở tab mới ↗</a><button onclick="closeP()">✕ Đóng</button></span></div><iframe id="pframe"></iframe></div></div>

<!-- Thư viện 3D -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- Dữ liệu (file bạn sửa) -->
<script src="data/members.js"></script>

<!-- Code (giữ nguyên thứ tự) -->
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/characters.js"></script>
<script src="js/interaction.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
