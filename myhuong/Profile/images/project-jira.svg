<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="jira-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#jira-bg)"/>

  <!-- Grid decoration lines -->
  <line x1="50" y1="50" x2="550" y2="50" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="50" y1="180" x2="550" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="50" y1="310" x2="550" y2="310" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- Left: GitHub Webhook Box -->
  <rect x="50" y="90" width="180" height="180" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="140" cy="140" r="30" fill="#0f172a"/>
  <!-- GitHub Octocat style icon -->
  <path d="M140 120 C125 120 115 130 115 145 C115 158 123 167 134 170 C136 170 136 169 136 168 L136 162 C128 164 126 158 126 158 C124 154 122 153 122 153 C119 151 122 151 122 151 C125 151 127 154 127 154 C130 159 135 157 137 156 C137 154 138 152 139 151 C132 150 125 147 125 136 C125 133 126 130 128 128 C128 127 127 124 128 120 C128 120 131 119 137 123 C140 122 143 122 146 122 C149 122 152 122 155 123 C161 119 164 120 164 120 C165 124 164 127 164 128 C166 130 167 133 167 136 C167 147 160 150 153 151 C154 152 156 155 156 159 L156 168 C156 169 156 170 158 170 C169 167 177 158 177 145 C177 130 167 120 140 120 Z" fill="#38bdf8"/>
  <text x="140" y="195" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">GitHub Webhook</text>
  <text x="140" y="218" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Push / PR Events</text>
  <rect x="75" y="235" width="130" height="22" rx="11" fill="#0369a1"/>
  <text x="140" y="250" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#e0f2fe" text-anchor="middle">JSON Payload</text>

  <!-- Middle: Connection Flow Pipeline with Spring Boot -->
  <path d="M230 180 L370 180" stroke="url(#accent-cyan)" stroke-width="4" stroke-dasharray="8 6"/>
  <polygon points="370,180 355,172 355,188" fill="#38bdf8"/>

  <!-- Spring Core Badge in the middle -->
  <circle cx="300" cy="180" r="34" fill="#065f46" stroke="#10b981" stroke-width="3"/>
  <text x="300" y="185" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Spring</text>
  <text x="300" y="200" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Boot</text>

  <!-- Right: Jira Cloud Box -->
  <rect x="370" y="90" width="180" height="180" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <rect x="425" y="115" width="70" height="50" rx="8" fill="#0052cc"/>
  <!-- Jira simple stylized mark -->
  <path d="M450 125 L470 145 L450 155 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M440 135 L455 150 L440 158 Z" fill="#ffffff" opacity="0.6"/>
  <text x="460" y="195" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Jira Cloud API</text>
  <text x="460" y="218" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Auto-Transition Tasks</text>
  <rect x="395" y="235" width="130" height="22" rx="11" fill="#4338ca"/>
  <text x="460" y="250" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#e0e7ff" text-anchor="middle">REST Automation</text>

  <!-- Top Banner Tag -->
  <rect x="180" y="25" width="240" height="32" rx="16" fill="#312e81"/>
  <text x="300" y="46" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#c7d2fe" text-anchor="middle">CI/CD &amp; Workflow Automation</text>
</svg>

